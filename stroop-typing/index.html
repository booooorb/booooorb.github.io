<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stroop Type</title>
    <link rel="stylesheet" href="game.css" />
</head>

<body>
    <main class="app">
        <header class="top">
            <div class="left">
                <div class="title">strooptype</div>
                <p class="sub">
                    Type the <strong>INK COLOR</strong> (not the word). Start typing to begin.
                </p>
            </div>

            <div class="right">
                <div class="stat">
                    <div class="label"><strong>time</strong></div>
                    <div class="value"><span id="timeLeft">30</span><span class="unit">s</span></div>
                </div>
                <div class="stat">
                    <div class="label"><strong>wpm</strong></div>
                    <div class="value" id="wpm">0</div>
                </div>
            </div>
        </header>

        <section class="bar">
            <div class="modes">
                <button id="modeCongruent" class="btn active" type="button">word = color</button>
                <button id="modeIncongruent" class="btn" type="button">word &ne; color</button>
            </div>

            <div class="actions">
                <div id="statusPill" class="statusText"><strong>word = color</strong></div>
                <button id="restart" class="btn" type="button">restart</button>
            </div>
        </section>

        <section class="stage">
            <div id="stimulus" class="stimulus">start typing...</div>

            <div class="inputRow">
                <span class="prompt">></span>

                <div class="inputWrap">
                    <div id="typedOverlay" class="typedOverlay" aria-hidden="true"></div>
                    <input id="answer" class="answer" type="text" inputmode="text" autocomplete="off" spellcheck="false"
                        placeholder="red / blue / green ..." />
                </div>
            </div>

            <div id="mini" class="mini"></div>
        </section>

        <section class="anim">
            <canvas id="stroopArena" class="arena"></canvas>
        </section>

        <footer class="foot">
            <div class="keys">Keys: <strong>Esc</strong> restart. <strong>Space</strong> and <strong>Enter</strong> stay disabled.</div>
        </footer>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
