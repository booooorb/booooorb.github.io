<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stroop Type</title>
    <link rel="stylesheet" href="game.css" />
</head>

<body>
    <main class="app">
        <header class="top">
            <div class="title">strooptype</div>

            <div class="right">
                <div class="stat">
                    <div class="label">time</div>
                    <div class="value"><span id="timeLeft">30</span><span class="unit">s</span></div>
                </div>
                <div class="stat">
                    <div class="label">wpm</div>
                    <div class="value" id="wpm">0</div>
                </div>
            </div>
        </header>

        <section class="bar">
            <div class="modes">
                <button id="modeCongruent" class="btn active" type="button">Congruent</button>
                <button id="modeIncongruent" class="btn" type="button">Incongruent</button>
            </div>

            <div class="actions">
                <button id="skipWarmup" class="btn" type="button" hidden>skip tutorial</button>
                <div id="statusPill" class="statusText">word = color</div>
                <button id="restart" class="btn" type="button">restart</button>
            </div>
        </section>

        <section class="stage">
            <div id="stimulus" class="stimulus is-idle">type to begin</div>

            <div class="inputRow">
                <div class="inputWrap">
                    <div id="typedOverlay" class="typedOverlay" aria-hidden="true"></div>
                    <input id="answer" class="answer" type="text" inputmode="text" autocomplete="off" spellcheck="false"
                        placeholder="type the color" />
                </div>
            </div>

            <div id="mini" class="mini"></div>
        </section>

        <section class="anim">
            <canvas id="stroopArena" class="arena"></canvas>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
