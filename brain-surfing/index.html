<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Brain Surfing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="src/game.css" />
</head>

<body>
  <div class="wrapper">
    <header class="top-bar">
      <a href="../" class="back-link">&larr; back</a>
      <div class="title">Brainwave Surfing</div>
    </header>

    <main class="game-area">
      <canvas id="game-canvas" width="900" height="1280"></canvas>

      <div class="hud hud-top-left" id="dataset-controls">
        <div class="hud-title">Dataset</div>
        <div class="dataset-buttons">
          <button type="button" data-dataset="sleep">Sleep</button>
          <button type="button" data-dataset="seizure">Seizure</button>

          <label class="upload-label">
            <span>Upload EDF</span>
            <input type="file" id="eeg-upload-input" accept=".edf,.EDF" style="display: none;" />
          </label>
        </div>
        <div id="channel-controls" class="channel-buttons"></div>

        <button id="info-toggle" type="button">
          EEG info v
        </button>

        <div id="eeg-info"></div>
      </div>

      <div id="eeg-status">EEG: loading...</div>

      <aside class="hud hud-bottom-left instructions-panel" id="controls-panel">
        <div class="hud-title">How To Surf</div>
        <p><strong>Jump:</strong> press <kbd>Space</kbd>, <kbd>W</kbd>, or <kbd>Up</kbd>. Tap/click also works.</p>
        <p><strong>Glide:</strong> hold the same input while you are in the air.</p>
        <p><strong>Flip:</strong> tap and release in the air for a quick trick.</p>
        <p><strong>Restart:</strong> press <kbd>R</kbd> after a crash.</p>
      </aside>
    </main>
  </div>

  <script src="src/config/config.js"></script>
  <script src="src/audio/surfAudio.js"></script>
  <script src="src/systems/sessionStats.js"></script>
  <script src="src/systems/spikes.js"></script>
  <script src="src/data/edfToJson.js"></script>
  <script src="src/game.js"></script>
</body>

</html>
